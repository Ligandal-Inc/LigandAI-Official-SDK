[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "ligandai"
version = "0.13.0"
description = "Official Python SDK for the LIGANDAI (TM) platform — peptide design, structure prediction, scoring, and discovery."
readme = "README.md"
license = { text = "Proprietary. Use of this SDK constitutes acceptance of https://ligandai.com/terms and https://ligandai.com/eula." }
requires-python = ">=3.10"
authors = [
    { name = "Andre Watson", email = "dre@ligandal.com" },
]
keywords = [
    "ligandai",
    "ligandforge",
    "deltaforge",
    "peptide-design",
    "protein-folding",
    "boltz2",
    "drug-discovery",
    "computational-biology",
    "bioinformatics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1.0",
    "pydantic>=2.0,<3.0",
    "tenacity>=8.0,<10.0",
    "typing-extensions>=4.5",
    # ⛔ CORE, NOT AN EXTRA. `ligandai campaign {run,validate,explain} <spec>`
    # takes a YAML file, the CLI's own help says "one YAML/JSON file", the only
    # shipped example is `examples/campaign/ca12_selective_binders.yaml`, and
    # that example's README says `pip install ligandai` and then hands the
    # customer `ligandai campaign validate ca12_selective_binders.yaml`.
    # PyYAML was declared NOWHERE — not here, not in an extra, not in `dev` —
    # so the documented quickstart for the headline 0.13.0 feature raised
    # `SpecError: PyYAML is required for YAML specs` on a clean install, and
    # the unit test that was supposed to check the CLI's exit codes could not
    # get past it either (it read exit 2 where it expected 3). Measured
    # 2026-09-21 in a fresh venv. [bd-dre-rp11j.28]
    "pyyaml>=6.0",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.7",
]
# SOCKS proxy support. httpx needs the `socksio` backend to route through a
# socks5:// / socks5h:// proxy (HTTPS_PROXY / ALL_PROXY); without it httpx
# raises ImportError at request time. Install with: pip install ligandai[socks]
socks = [
    "httpx[socks]>=0.27",
]
dev = [
    # tests/unit/test_packaging_contract.py builds a wheel with --no-isolation so
    # it never needs the network; that requires both of these present locally.
    # Without them the wheel tests SKIP (loudly) rather than pass. [bd-dre-rp11j.1]
    "build>=1.0",
    "hatchling>=1.21",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "pytest-cov>=4.1",
    "mypy>=1.10",
    "ruff>=0.5",
    "respx>=0.21",
    # ⛔ THE SUITE DOES NOT COLLECT WITHOUT THESE TWO. [bd-dre-rp11j.1]
    # tests/unit/test_folds.py does a module-level `import numpy` and
    # tests/unit/test_fold_charts.py imports matplotlib. Neither was declared
    # here, so `pip install -e '.[dev]' && pytest tests/unit` ended in
    # "ModuleNotFoundError: No module named 'numpy'" -> "Interrupted: 1 error
    # during collection". A collection error ABORTS THE WHOLE RUN: the other 55
    # test files never executed, and the output said "1 error", not "0 of 56
    # files ran". Verified 2026-09-20.
    "numpy>=1.24",
    "matplotlib>=3.7",
]
docs = [
    "sphinx>=7.0",
    "sphinx-autoapi>=3.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
]

[project.scripts]
ligandai = "ligandai.cli:main"

[project.urls]
Homepage = "https://ligandai.com"
Documentation = "https://docs.ligandai.com"
Repository = "https://github.com/Ligandal-Inc/LigandAI-Official-SDK"
Issues = "https://github.com/Ligandal-Inc/LigandAI-Official-SDK/issues"
Changelog = "https://github.com/Ligandal-Inc/LigandAI-Official-SDK/blob/main/CHANGELOG.md"

# Build hygiene, applied to EVERY target. Belt-and-braces, and the note that
# came with it was WRONG, so it is corrected here rather than left to be
# re-trusted. [bd-dre-rp11j.1, corrected bd-dre-rp11j.28]
#
# MEASURED 2026-09-21 on hatchling 1.32.4, by planting
# `skills/openai-tool-calling/__pycache__/agent_example.cpython-311.pyc` and a
# `skills/.pytest_cache/` tree and rebuilding: NEITHER appears in the wheel's
# zip namelist, with these `exclude` patterns present OR absent, and with
# `__pycache__/` removed from `.gitignore` OR left in it. Hatchling filters
# cache directories out of `force-include` by itself, so these patterns are not
# what keeps bytecode out — published 0.12.2 was clean for that reason, not by
# luck.
#
# ⛔ WHAT IS ACTUALLY UNGUARDED HERE, measured in the same experiment:
# `force-include` ships any NON-cache file sitting in the tree. Dropping
# `skills/openai-tool-calling/SCRATCH_NOTES.txt` on the build machine put
# `ligandai/agent_assets/skills/openai-tool-calling/SCRATCH_NOTES.txt` in the
# wheel, and an untracked file does not show up in a `git status` review of the
# release commit. That hole is closed by a test, not by a pattern:
# tests/unit/test_packaging_contract.py::
# test_wheel_agent_assets_match_the_git_tracked_sources pins the shipped
# payload to `git ls-files`.
[tool.hatch.build]
exclude = [
    "**/__pycache__",
    "**/*.py[cod]",
    "**/.pytest_cache",
    "**/.mypy_cache",
    "**/.ruff_cache",
]

[tool.hatch.build.targets.wheel]
packages = ["ligandai"]

# ⛔ THE DESTINATIONS BELOW MUST STAY UNDER `ligandai/`.
#
# These agent-facing docs used to be force-included at the destinations
# "AGENTS.md", "CLAUDE.md", "skills" and ".claude/skills" — i.e. the ROOT of
# site-packages. Verified on 2026-09-20 against a clean venv install of PyPI
# 0.12.2: `pip install ligandai` wrote AGENTS.md, CLAUDE.md, a `.claude/`
# directory and a `skills/` directory directly into site-packages, and
# `importlib.util.find_spec("skills")` then resolved to OUR directory as a
# namespace package. Three concrete consequences:
#   1. `import skills` in any downstream project silently binds to LigandAI's
#      docs directory instead of that project's own module.
#   2. AGENTS.md / CLAUDE.md are generic filenames; a second package shipping
#      either one overwrites ours (and `pip uninstall ligandai` then deletes
#      THEIRS, because both are listed in our RECORD).
#   3. An SDK has no business writing a dotfile directory into the environment
#      root.
# Shipping them inside the package keeps the payload discoverable
# (`site-packages/ligandai/AGENTS.md`) while owning only our own namespace.
# [bd-dre-rp11j.1]
[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "ligandai/AGENTS.md"
"CLAUDE.md" = "ligandai/CLAUDE.md"
"skills" = "ligandai/agent_assets/skills"
".claude/skills" = "ligandai/agent_assets/claude_skills"

[tool.hatch.build.targets.sdist]
include = [
    "/ligandai",
    "/tests",
    "/examples",
    "/skills",
    "/.claude/skills",
    "/AGENTS.md",
    "/CLAUDE.md",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml",
]

[tool.hatch.build.targets.sdist.force-include]
"CLAUDE.md" = "CLAUDE.md"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["docs/_build", ".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pyflakes/pycodestyle
    "I",            # isort
    "B",            # bugbear
    "UP",           # pyupgrade
    "C4",           # comprehensions
    "SIM",          # simplify
    "RUF",          # ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function calls in defaults — pydantic Field()
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"examples/**" = ["E501"]
# These resources intentionally use typing.List[...] (not list[...]) to dodge
# a mypy quirk: methods named `list()` shadow the builtin in their own class.
"ligandai/resources/memory.py" = ["UP006", "UP035"]
"ligandai/resources/programs.py" = ["UP006", "UP035"]
"ligandai/resources/receptors.py" = ["UP006", "UP035"]
# Bivalent's _linker_dump uses `l` for parallel structure with _target_dump(t).
"ligandai/resources/bivalent.py" = ["E741"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_no_return = true
plugins = ["pydantic.mypy"]
# Note: not using strict=true because resource methods named `list`/`get` shadow
# builtins in their own class scope — mypy then misreads `list[X]` as subscripting
# the method. This is a known limitation; we use selective options instead.

[[tool.mypy.overrides]]
module = "ligandai.resources.*"
# Resources intentionally name methods `list`, `get`, etc.; mypy gets confused by
# `list[T]` annotations in the same class. Disable disallow-any-generics for
# resources only.
disallow_any_generics = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires LIGANDAI_TEST_API_KEY env var (deselect with '-m \"not integration\"')",
    "slow: tests that take >5s",
]

[tool.coverage.run]
source = ["ligandai"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@overload",
]
